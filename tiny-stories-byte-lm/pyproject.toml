[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitter-lesson"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=26.0.1",
    "torch",
]

[project.optional-dependencies]
optimizer-probe = [
    "scipy>=1.15",
    "torchzero>=0.4.4",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]
